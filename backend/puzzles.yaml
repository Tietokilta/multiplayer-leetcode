- id: fibonacci
  title: Fibonacci Sequence
  description: |
    Write a function that **prints** the first N numbers in the Fibonacci sequence.

    The Fibonacci sequence starts with 1 and 1, and each subsequent number is the sum of the two preceding ones.

    For example, the first 6 numbers in the Fibonacci sequence are:\
    1\
    1\
    1 + 1 = 2\
    1 + 2 = 3\
    2 + 3 = 5\
    3 + 5 = 8
  template: |
    def fibonacci(n):
      # Your code here
      a = 1
      b = 1
      |
  modelSolution: |
    for _ in range(n):
      print(a)
      a, b = b, a + b
  wrapper: |
    {}

    def _test():
      import random as _random
      _test_ns = [5, 10, 1, 0, 15] + [_random.randint(7, 15) for _ in range(3)]

      def _fib(n):
        a, b = 1, 1
        for _ in range(n):
          print(a)
          a, b = b, a + b

      for _n in _test_ns:
        print("fibonacci(" + str(_n) + "):")
        _fib(_n)
        print()
      print("=== END EXPECTED OUTPUT ===")

      for _n in _test_ns:
        print("fibonacci(" + str(_n) + "):")
        fibonacci(_n)
        print()

    _test()

