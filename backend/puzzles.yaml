- id: bogosort
  title: Bogosort
  description: |
    Implement the Bogosort algorithm to sort a list of integers. The function must modify the list in place.

    Bogosorting a list works by shuffling the list until it is sorted. You may not modify the list other than random.shuffle().
  template: |
    from random import shuffle

    def bogosort(lst):
      # Your code here
      |
  modelSolution: |
    while lst != sorted(lst):
      shuffle(lst)
  wrapper: |
    {}

    def _wrap_list(lst):
      import inspect
      from collections.abc import MutableSequence
      class list(MutableSequence):
        def __getitem__(self, index):
          return lst.__getitem__(index)
        def __setitem__(self, index, value):
          if inspect.stack()[1].frame.f_code.co_qualname != "Random.shuffle":
            raise RuntimeError("Modifying the list is not allowed except by random.shuffle().")
          return lst.__setitem__(index, value)
        def __delitem__(self, index):
          raise RuntimeError("Modifying the list is not allowed except by random.shuffle().")
        def insert(self, index, value):
          raise RuntimeError("Modifying the list is not allowed except by random.shuffle().")
        def __len__(self):
          return lst.__len__()
        def __str__(self):
          return lst.__str__()
        def __repr__(self):
          return lst.__repr__()
      return list()

    def _test():
      import random as _random
      _lsts = [
        [],
        [1],
        [3, 2, 5, 1, 4],
        [10, -1, 2, 0, 5],
        [_random.randint(-10, 10) for _ in range(_random.randint(4, 5))]
      ]

      for _lst in _lsts:
        print("bogosort(" + str(_lst) + ") =", sorted(_lst))
      print("=== END EXPECTED OUTPUT ===")

      for _lst in _lsts:
        _wrapped = _wrap_list(_lst)
        bogosort(_wrapped)
        print("bogosort(" + str(_lst) + ") =", _wrapped)

    _test()

- id: fizzbuzz
  title: FizzBuzz
  description: |
    Write a function that returns:
    - **"FizzBuzz"** if n is divisible by both 3 and 5
    - **"Fizz"** if n is divisible only by 3
    - **"Buzz"** if n is divisible only by 5
    - the number as a **string** otherwise
  template: |
    def fizzbuzz(n):
      |
  modelSolution: |
    if n % 15 == 0:
      return "FizzBuzz"
    elif n % 3 == 0:
      return "Fizz"
    elif n % 5 == 0:
      return "Buzz"
    else:
      return str(n)
  wrapper: |
    {}

    def _test():
      import random as _random
      _cases = [1, 3, 5, 15, 30, 7, 9, 10, 21, 25] + [_random.randint(1, 50) for _ in range(3)]
      def _fb(n):
        if n % 15 == 0: return "FizzBuzz"
        elif n % 3 == 0: return "Fizz"
        elif n % 5 == 0: return "Buzz"
        else: return str(n)
      for _n in _cases:
        print("fizzbuzz(" + str(_n) + ") =", _fb(_n))
      print("=== END EXPECTED OUTPUT ===")
      for _n in _cases:
        print("fizzbuzz(" + str(_n) + ") =", fizzbuzz(_n))

    _test()

- id: print_multiples
  title: Print Multiples
  description: |
    Write a function that prints all multiples of k from k up to and including n.

    For example, print_multiples(3, 12) would print:\
    3\
    6\
    9\
    12
  template: |
    def print_multiples(k, n):
      |
  modelSolution: |
    for i in range(k, n + 1, k):
      print(i)
  wrapper: |
    {}

    def _test():
      import random as _random
      _cases = [(3, 12), (5, 20), (2, 10), (7, 21), (4, 16)] + [
        (_random.randint(2, 8), _random.randint(10, 30)) for _ in range(2)
      ]
      for _k, _n in _cases:
        print("print_multiples(" + str(_k) + ", " + str(_n) + "):")
        for _i in range(_k, _n + 1, _k):
          print(_i)
        print()
      print("=== END EXPECTED OUTPUT ===")
      for _k, _n in _cases:
        print("print_multiples(" + str(_k) + ", " + str(_n) + "):")
        print_multiples(_k, _n)
        print()

    _test()

- id: count_occurrences
  title: Count Occurrences
  description: Write a function that counts how many times a value appears in a list.
  template: |
    def count_occurrences(lst, value):
      |
  modelSolution: |
    count = 0
    for x in lst:
      if x == value:
        count += 1
    return count
  wrapper: |
    {}

    def _test():
      import random as _random
      _cases = [
        ([1, 2, 3, 2, 1], 2),
        ([5, 5, 5, 5], 5),
        ([1, 2, 3], 4),
        (["a", "b", "a", "c", "a"], "a"),
        ([_random.randint(1, 3) for _ in range(8)], 2),
      ]
      for _lst, _val in _cases:
        print("count_occurrences(" + str(_lst) + ", " + repr(_val) + ") =", _lst.count(_val))
      print("=== END EXPECTED OUTPUT ===")
      for _lst, _val in _cases:
        print("count_occurrences(" + str(_lst) + ", " + repr(_val) + ") =", count_occurrences(_lst, _val))

    _test()

- id: sum_digits
  title: Sum of Digits
  description: |
    Write a function that returns the sum of the digits of a non-negative integer.

    For example, the sum of digits of 1234 is 1 + 2 + 3 + 4 = 10.
  template: |
    def sum_digits(n):
      |
  modelSolution: |
    total = 0
    while n > 0:
      total += n % 10
      n //= 10
    return total
  wrapper: |
    {}

    def _test():
      import random as _random
      _cases = [0, 1, 123, 9999, 1234, 100] + [_random.randint(100, 9999) for _ in range(3)]
      def _sd(n):
        total = 0
        while n > 0:
          total += n % 10
          n //= 10
        return total
      for _n in _cases:
        print("sum_digits(" + str(_n) + ") =", _sd(_n))
      print("=== END EXPECTED OUTPUT ===")
      for _n in _cases:
        print("sum_digits(" + str(_n) + ") =", sum_digits(_n))

    _test()