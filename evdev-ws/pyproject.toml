[project]
name = "evdev-ws"
version = "0.1.0"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    "evdev>=1.9.2",
    "pyudev>=0.24.3",
    "websockets>=13.1",
]

[tool.black]
line-length = 120
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 120
py_version=313
combine_as_imports = true
